name: Build & Release

on:
  push:
    tags:
      - 'v*'          # full versioned GitHub Release: git tag v1.0.0 && git push --tags
    branches:
      - main          # build-only, grab the EXE/DMG from this run's Actions artifacts
  workflow_dispatch:   # manual on-demand build

permissions:
  contents: write   # required to create the GitHub release

jobs:
  # ── Windows EXE ─────────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build EXE
        env:
          OVERLEX_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('0.0.{0}', github.run_number) }}
        run: python build_win.py

      - name: Smoke test OCR helper
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "dist/OverLex/OverLex.exe" -PassThru
          Start-Sleep -Seconds 5
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          $ps1 = "dist/OverLex/_ocr_helper.ps1"
          if (-not (Test-Path $ps1)) { throw "OverLex.exe did not generate $ps1" }
          python -c "from PIL import Image, ImageDraw; img = Image.new('RGB',(300,80),'white'); d = ImageDraw.Draw(img); d.text((10,20),'Hello World',fill='black'); img.save('ocr_test.bmp','BMP')"
          $imgPath = (Resolve-Path "ocr_test.bmp").Path
          $out = & powershell -NonInteractive -NoProfile -ExecutionPolicy Bypass -File $ps1 $imgPath 2>&1
          Write-Output $out
          if (-not ($out -match "Hello")) { throw "OCR smoke test did not recognize the test image. Output: $out" }

      - name: Package zip + checksum
        run: |
          Compress-Archive -Path dist/OverLex -DestinationPath dist/OverLex-Windows.zip
          (Get-FileHash dist/OverLex-Windows.zip -Algorithm SHA256).Hash | Out-File -Encoding ascii dist/OverLex-Windows.zip.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            dist/OverLex-Windows.zip
            dist/OverLex-Windows.zip.sha256

  # ── macOS DMG ───────────────────────────────────────────────────────────────
  build-mac:
    runs-on: macos-latest   # Apple Silicon (arm64) only
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Build DMG
        env:
          OVERLEX_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('0.0.{0}', github.run_number) }}
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: bash build_mac.sh

      - uses: actions/upload-artifact@v7
        with:
          name: mac
          path: |
            dist/OverLex.dmg
            dist/OverLex.dmg.sha256

  # ── GitHub Release ───────────────────────────────────────────────────────────
  # Tag pushes (v*) get their own versioned release. Everything else (main pushes,
  # manual runs) updates a rolling 'latest' release so a build is always downloadable
  # from /releases/latest without cutting a version tag.
  release:
    needs: [build-windows, build-mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Move rolling 'latest' tag to this commit
        if: "!startsWith(github.ref, 'refs/tags/')"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f latest
          git push origin -f latest

      - uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Combine checksums
        run: cat artifacts/windows/*.sha256 artifacts/mac/*.sha256 > artifacts/SHA256SUMS.txt

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('OverLex {0}', github.ref_name) || 'OverLex (latest main build)' }}
          body: |
            # ${{ startsWith(github.ref, 'refs/tags/') && format('OverLex {0}', github.ref_name) || 'OverLex — latest main build' }}

            ${{ startsWith(github.ref, 'refs/tags/') && 'Tagged release.' || format('Automatically built from commit {0} on main.', github.sha) }}

            ## Download
            | Platform | File |
            |---|---|
            | Windows 10/11 | `OverLex-Windows.zip` → unzip, run `OverLex.exe` |
            | macOS 12+ (Apple Silicon) | `OverLex.dmg` → open, drag into Applications |

            Verify a download against `SHA256SUMS.txt` before running it.

            ## Windows SmartScreen
            The Windows build is not code-signed (no EV certificate). On first run SmartScreen may
            show "Windows protected your PC" — click **More info → Run anyway**. The binary is
            unmodified from what this workflow built; you can confirm via the published checksum.

            ## macOS Gatekeeper
            The DMG is signed with a Developer ID certificate and notarized by Apple when the
            repository has signing secrets configured; otherwise it is ad-hoc signed only, and
            Gatekeeper will require **System Settings → Privacy & Security → Open Anyway**.
          files: |
            artifacts/windows/OverLex-Windows.zip
            artifacts/mac/OverLex.dmg
            artifacts/SHA256SUMS.txt
          draft: false
          prerelease: false
